<style>
    /* modal tambah sertifikat isinya panjang, jadi kotaknya dibatasi
       setinggi layar dan isinya bisa di-scroll */
    #add-certification-modal {
        height: 100vh !important;
        align-items: center !important;
    }

    #add-certification-modal .project-delete-modal__content {
        width: min(100%, 640px) !important;
        max-height: 90vh !important;
        overflow-y: auto !important;
    }
</style>

<div id="add-certification-modal"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-certification-modal-title">
    <!-- klik area gelap di luar kotak = tutup modal -->
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="add-certification-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah sertifikat"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="add-certification-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah sertifikat">×</button>

        <h2 id="add-certification-modal-title">Tambah Sertifikat Baru</h2>
        <!-- Tutorial 6: dikirim lewat HTMX, error dari server muncul di #add-error -->
        <form id="certification-form"
              class="project-form"
              hx-post="{% url 'main:create_certification_htmx' %}"
              hx-target="#add-error"
              hx-swap="innerHTML"
              hx-disabled-elt="find button[type='submit']">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <p id="add-error" class="form-error" aria-live="polite"></p>
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-certification-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Sertifikat</button>
            </div>
        </form>
    </div>
</div>
