<!-- baris versi form edit -->
<!-- input-nya nyambung ke form di kolom terakhir lewat atribut form="..." -->
<tr id="contact-{{ contact.id }}">
  <td>
    <input type="text" name="name" value="{{ contact.name }}" required
           form="edit-form-{{ contact.id }}">
  </td>
  <td>
    <input type="email" name="email" value="{{ contact.email }}" required
           form="edit-form-{{ contact.id }}">
  </td>
  <td>
    <!-- input phone, ga wajib diisi -->
    <input type="tel" name="phone" value="{{ contact.phone }}"
           form="edit-form-{{ contact.id }}">
  </td>
  <td>
    <!-- simpan: kirim PUT, hasilnya baris normal yang udah keupdate -->
    <form id="edit-form-{{ contact.id }}"
          hx-put="{% url 'contacts:contact_update' contact.id %}"
          hx-target="#contact-{{ contact.id }}"
          hx-swap="outerHTML">
      <button type="submit">Simpan</button>
    </form>

    <!-- batal: minta lagi baris normalnya, ga ada yang disimpan -->
    <button hx-get="{% url 'contacts:contact_row' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML">
      Batal
    </button>
  </td>
</tr>
